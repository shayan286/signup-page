
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Page Signup Form</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
    color: #333;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #667eea;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5266cc;
}

.back {
    background: #777;
}

.back:hover {
    background: #555;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.progress {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.step {
    width: 32px;
    height: 32px;
    background: #ddd;
    color: #555;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.step.active {
    background: #667eea;
    color: white;
}

.details {
    background: #f4f5ff;
    padding: 15px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.details p {
    margin: 12px 0;
    color: #333;
}

.success {
    text-align: center;
    color: #28a745;
    font-size: 45px;
    margin-bottom: 15px;
}

</style>
</head>

<body>

<div class="container">

    <div class="progress">
        <div class="step active" id="step1">1</div>
        <div class="step" id="step2">2</div>
        <div class="step" id="step3">3</div>
    </div>

    <!-- PAGE 1 -->

    <div class="page active" id="page1">

        <h1>Create Account</h1>
        <p class="subtitle">Step 1 of 3 - Account Information</p>

        <form id="form1">

            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Create password"
                   minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" id="confirm"
                   placeholder="Confirm password" required>

            <button type="submit">Next →</button>

        </form>
    </div>


    <!-- PAGE 2 -->

    <div class="page" id="page2">

        <h1>Personal Details</h1>
        <p class="subtitle">Step 2 of 3 - Additional Information</p>

        <form id="form2">

            <label>Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Address</label>
            <textarea id="address"
                      placeholder="Enter your address"
                      required></textarea>

            <button type="submit">Next →</button>

            <button type="button" class="back"
                    onclick="showPage(1)">
                ← Back
            </button>

        </form>
    </div>


    <!-- PAGE 3 -->

    <div class="page" id="page3">

        <div class="success">✓</div>

        <h1>Registration Complete!</h1>

        <p class="subtitle">Step 3 of 3 - Review Your Details</p>

        <div class="details">

            <p><b>Name:</b> <span id="showName"></span></p>

            <p><b>Email:</b> <span id="showEmail"></span></p>

            <p><b>Phone:</b> <span id="showPhone"></span></p>

            <p><b>Date of Birth:</b> <span id="showDob"></span></p>

            <p><b>Gender:</b> <span id="showGender"></span></p>

            <p><b>Address:</b> <span id="showAddress"></span></p>

        </div>

        <h2 style="text-align:center; margin-top:20px;">
            Thank You!
        </h2>

        <button onclick="finishSignup()">Finish</button>

        <button class="back" onclick="showPage(2)">
            ← Back
        </button>

    </div>

</div>


<script>

// PAGE NAVIGATION

function showPage(pageNumber) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById("page" + pageNumber)
        .classList.add("active");

    document.querySelectorAll(".step").forEach(step => {
        step.classList.remove("active");
    });

    for (let i = 1; i <= pageNumber; i++) {
        document.getElementById("step" + i)
            .classList.add("active");
    }

}


// PAGE 1 VALIDATION

document.getElementById("form1").addEventListener("submit",
function(event) {

    event.preventDefault();

    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    if (password !== confirm) {
        alert("Passwords do not match!");
        return;
    }

    showPage(2);

});


// PAGE 2 VALIDATION

document.getElementById("form2").addEventListener("submit",
function(event) {

    event.preventDefault();

    // Display information on page 3

    document.getElementById("showName").textContent =
        document.getElementById("name").value;

    document.getElementById("showEmail").textContent =
        document.getElementById("email").value;

    document.getElementById("showPhone").textContent =
        document.getElementById("phone").value;

    document.getElementById("showDob").textContent =
        document.getElementById("dob").value;

    document.getElementById("showGender").textContent =
        document.getElementById("gender").value;

    document.getElementById("showAddress").textContent =
        document.getElementById("address").value;

    showPage(3);

});


// FINISH SIGNUP

function finishSignup() {

    alert("Your registration has been completed successfully!");

    document.querySelectorAll("input, textarea, select")
        .forEach(field => field.value = "");

    document.getElementById("form1").reset();
    document.getElementById("form2").reset();

    showPage(1);

}

</script>

</body>
</html>
